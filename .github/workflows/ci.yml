name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bcftools (the extraction and the index statistics use it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bcftools tabix
      - name: Install (with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run tests
        run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - name: Build image (load locally for testing)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arraykaryo:ci
      - name: Test the image on the mock (mock, run, the report)
        run: |
          docker run --rm arraykaryo:ci --version
          mkdir -p ci_out && chmod 777 ci_out
          docker run --rm -v "$PWD/ci_out:/data" arraykaryo:ci mock --out /data/mock --samples 40 --seed 3
          docker run --rm -v "$PWD/ci_out:/data" arraykaryo:ci run --bcf /data/mock/mock.bcf --out /data/out --threads 2 --sample-sheet /data/mock/sample_sheet.tsv --pedigree /data/mock/pedigree.tsv
          test -s ci_out/out/report/index.html && test -s ci_out/out/events/events.all.tsv && grep -c . ci_out/out/events/karyotypes.tsv
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
