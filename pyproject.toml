[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arraykaryo"
version = "0.5.2"
description = "Large chromosomal events in a genotyping-array cohort from its VCF/BCF export (GT, LRR, BAF): array QC, pedigree inferred from the genotypes, sex-chromosome complement with aneuploidies and mosaics, near-chromosomal gains, losses, copy-neutral LOH and runs of homozygosity with cell fraction; one interpretable report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["genotyping array", "LRR", "BAF", "mosaic", "aneuploidy", "copy number", "ROH", "pedigree", "kinship", "sex check", "karyotype"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = ["pysam>=0.22", "numpy>=1.22", "matplotlib>=3.5", "cyvcf2>=0.30"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
arraykaryo = "arraykaryo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arraykaryo = ["data/*.tsv"]

[tool.pytest.ini_options]
markers = ["slow: the end-to-end run of the CLI on the mock (about a minute)"]
